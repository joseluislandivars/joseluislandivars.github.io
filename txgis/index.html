<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAV Crop Features Extractor · Example results</title>
<meta name="description" content="Example canopy features extracted from drone imagery by the UAV Crop Features Extractor, Digital Ag-Lab, Texas A&amp;M AgriLife Research.">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #14161a; --muted: #5b6270; --border: #e5e8ee;
    --accent: #5a1f33; --accent-hover: #481829;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
    --radius: 10px; --control-height: 48px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16px; }
  main { max-width: 520px; margin: var(--space-6) auto; padding: 0 var(--space-3); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,22,26,.04); }
  header { background: var(--accent); color: #fff; padding: var(--space-5) var(--space-5); }
  h1 { margin: 0; font-size: 21px; font-weight: 650; line-height: 1.25; }
  .credit { margin-top: var(--space-1); font-size: 14px; opacity: .9; }
  .body { padding: var(--space-5); }
  h2 { margin: 0 0 var(--space-1); font-size: 18px; font-weight: 650; }
  .sub { margin: 0 0 var(--space-4); color: var(--muted); font-size: 15px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin: 0 0 var(--space-5); padding: 0; list-style: none; }
  .stats li { border: 1px solid var(--border); border-radius: 8px; padding: var(--space-3); }
  .stats .label { display: block; font-size: 13px; color: var(--muted); }
  .stats .value { display: block; margin-top: 2px; font-size: 20px; font-weight: 650; }
  .stats .value small { font-size: 14px; font-weight: 500; color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--control-height);
    padding: var(--space-2) var(--space-4); border: 1px solid var(--accent); border-radius: 8px;
    font-weight: 650; font-size: 16px; text-decoration: none;
    transition: transform 140ms cubic-bezier(0.23,1,0.32,1), background-color 140ms ease, border-color 140ms ease; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: #fff; color: var(--accent); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-secondary:hover { background: #f8f1f3; }
  }
  .btn:active { transform: scale(0.97); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:active { transform: none; } }
  footer { margin: var(--space-4) 0 0; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
  @media (max-width: 360px) { .actions { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <header>
      <h1>UAV Crop Features Extractor</h1>
      <div class="credit">Developed by Digital Ag-Lab</div>
    </header>
    <div class="body">
      <h2>Extraction ready</h2>
      <p class="sub">Alfalfa trial · RGB · 36 plots · 1 min runtime</p>
      <ul class="stats">
        <li><span class="label">Canopy cover</span><span class="value">36.99%</span></li>
        <li><span class="label">ExG</span><span class="value">0.193 <small>index</small></span></li>
        <li><span class="label">Canopy height</span><span class="value">0.092 <small>m</small></span></li>
        <li><span class="label">Canopy volume</span><span class="value">0.376 <small>m³</small></span></li>
      </ul>
      <div class="actions">
        <a class="btn btn-primary" href="alfalfa_canopy_features.xlsx" download>Download</a>
        <a class="btn btn-secondary" href="features.html">View features</a>
      </div>
    </div>
  </div>
  <footer>Texas A&amp;M AgriLife Research · TxGIS Day 2026</footer>
</main>
</body>
</html>
